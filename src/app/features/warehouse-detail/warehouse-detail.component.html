<section class="header">
  <a routerLink="/">← Back</a>
  <h1>Warehouse {{ warehouseId() }}</h1>
</section>

<section class="filters">
  <label class="toggle">
    <mat-slide-toggle (ngModelChange)="lowOnly.set($event)">Low stock only</mat-slide-toggle>
  </label>

  <div class="category-filter">
    <select (change)="category.set($event.target.value)">
      <option value="">All Categories</option>
      <option *ngFor="let c of state.categories()" [value]="c">{{ c }}</option>
    </select>
  </div>

  <button mat-stroked-button (click)="reset()">Reset</button>
</section>

<div class="table card">
  <h3>Inventory Details</h3>
  <table>
    <thead>
      <tr>
        <th>Product</th>
        <th>Category</th>
        <th>Stock</th>
        <th>Reorder Level</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let r of rows()" [class.low-stock]="r.StockQty <= r.ReorderLevel">
        <td>{{ r.product?.Name }} ({{ r.ProductID }})</td>
        <td>{{ r.product?.Category }}</td>
        <td>{{ r.StockQty }}</td>
        <td>{{ r.ReorderLevel }}</td>
      </tr>
    </tbody>
  </table>
</div>

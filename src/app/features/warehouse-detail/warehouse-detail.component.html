<section class="header">
    <a routerLink="/">← Back</a>
    <h1>Warehouse {{ warehouseId() }}</h1>
</section>

<section class="filters">
    <mat-slide-toggle (ngModelChange)="lowOnly.set($event)">Low stock only</mat-slide-toggle>
    <mat-form-field appearance="outline">
        <mat-select placeholder="Category"
            (valueChange)="category.set($event)">
            <mat-option [value]="null">All</mat-option>
            <mat-option *ngFor="let c of state.categories()" [value]="c">{{ c
                }}</mat-option>
        </mat-select>
    </mat-form-field>
    <button mat-stroked-button (click)="reset()">Reset</button>
</section>

<table mat-table [dataSource]="rows()" class="mat-elevation-z1">
    <ng-container matColumnDef="product">
        <th mat-header-cell *matHeaderCellDef> Product </th>
        <td mat-cell *matCellDef="let r"> {{ r.product?.Name }} ({{ r.ProductID
            }}) </td>
    </ng-container>

    <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef> Category </th>
        <td mat-cell *matCellDef="let r"> {{ r.product?.Category }} </td>
    </ng-container>

    <ng-container matColumnDef="stock">
        <th mat-header-cell *matHeaderCellDef> Stock </th>
        <td mat-cell *matCellDef="let r"> {{ r.StockQty }} </td>
    </ng-container>

    <ng-container matColumnDef="reorder">
        <th mat-header-cell *matHeaderCellDef> Reorder Level </th>
        <td mat-cell *matCellDef="let r"> {{ r.ReorderLevel }} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>
